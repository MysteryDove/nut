name: "GHA-09: Windows win32 x64 Build and Release"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "ci_build.sh BUILD_TYPE value"
        required: true
        type: string
        default: "cross-windows-mingw-64"
      bootstrap_mingw_prereqs:
        description: "Build and install extra mingw prerequisites (slower)"
        required: true
        type: boolean
        default: false
      create_release:
        description: "Create or update a GitHub Release and upload the archive"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag (leave empty for auto-generated tag)"
        required: false
        type: string
        default: ""
      release_name:
        description: "Release title (leave empty for default title)"
        required: false
        type: string
        default: ""
      release_draft:
        description: "Create as draft"
        required: true
        type: boolean
        default: true
      release_prerelease:
        description: "Mark release as pre-release"
        required: true
        type: boolean
        default: false
      generate_release_notes:
        description: "Generate release notes automatically"
        required: true
        type: boolean
        default: true
      make_latest:
        description: "Mark release as latest"
        required: true
        type: choice
        default: "legacy"
        options:
          - "legacy"
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build-win32-x64:
    name: "Build win32 x64 and optionally release"
    runs-on: ubuntu-latest
    env:
      TARGET_TRIPLET: "x86_64-w64-mingw32"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install base prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            ccache \
            gcc \
            g++ \
            libtool \
            libtool-bin \
            make \
            mingw-w64 \
            pkg-config \
            zip

      - name: Build mingw prerequisites
        if: ${{ inputs.bootstrap_mingw_prereqs }}
        run: ./scripts/Windows/build-mingw-prereqs.sh

      - name: Build NUT for Windows win32 x64
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          BUILD_TYPE="${BUILD_TYPE}" ./ci_build.sh

      - name: Package build output
        id: package
        run: |
          set -euo pipefail
          install_dir="scripts/Windows/nut_install_${TARGET_TRIPLET}"
          if [ ! -d "${install_dir}" ]; then
            echo "ERROR: expected build output directory '${install_dir}' was not found" >&2
            echo "Known candidates:" >&2
            find scripts/Windows -maxdepth 1 -type d -name 'nut_install*' -print >&2 || true
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          archive_name="nut-win32-x64-${TARGET_TRIPLET}-${GITHUB_RUN_NUMBER}-${short_sha}.zip"
          archive_path="${PWD}/${archive_name}"
          checksum_path="${archive_path}.sha256"

          (cd scripts/Windows && zip -r -9 "${archive_path}" "$(basename "${install_dir}")")
          sha256sum "${archive_path}" > "${checksum_path}"

          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${archive_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Prepare release metadata
        if: ${{ inputs.create_release }}
        id: release_meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_RELEASE_TAG}"
          release_name="${INPUT_RELEASE_NAME}"

          if [ -z "${release_tag}" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              release_tag="${GITHUB_REF_NAME}"
            else
              release_tag="win32-x64-build-${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [ -z "${release_name}" ]; then
            release_name="Windows win32 x64 build ${release_tag}"
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          draft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.release_prerelease }}
          generate_release_notes: ${{ inputs.generate_release_notes }}
          make_latest: ${{ inputs.make_latest }}
          files: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
